<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Voice Assistant</title><link rel="stylesheet" href="/static/style.css"></head><body><main>
<header><div><small>AI • VOICE • BILINGUAL</small><h1>Nova <span>Voice Assistant</span></h1></div><b id="status">● Ready</b></header>
<section class="grid"><div class="card center"><div class="orb" id="orb"></div><p id="state">Say “Hey Nova” or press the microphone</p><button id="mic">🎙 Start Listening</button><button id="mode">♾ Voice Mode: Off</button><label>Language <select id="lang"><option value="ta-IN">தமிழ்</option><option value="en-US">English</option></select></label></div>
<div class="card chat"><h2>Conversation <button id="clear">Clear</button></h2><div id="messages"></div><form id="form"><input id="input" placeholder="Type in Tamil or English"><button>➤</button></form></div></section>
<section class="tools"><div class="card"><h3>🌦 Weather</h3><input id="city" placeholder="City"><button id="weather">Check</button><p id="weatherResult"></p></div><div class="card"><h3>🌐 Web Search</h3><input id="query" placeholder="Search"><button id="search">Search</button></div><div class="card"><h3>🧠 Wake Word</h3><p>Hey Nova / ஹே நோவா</p><button id="wake">Wake Detection: Off</button></div></section></main><script src="/static/app.js"></script></body></html>
